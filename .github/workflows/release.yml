name: 自动发布 chat2me
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: chat2me-release
  cancel-in-progress: false
  queue: max
permissions:
  contents: write
jobs:
  version:
    name: 自动编号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.number.outputs.version }}
      released: ${{ steps.number.outputs.released }}
      skip: ${{ steps.number.outputs.skip }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: 计算版本并创建标签
      id: number
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        test "$GITHUB_REF" = refs/heads/main
        python3 .github/scripts/version.py
  image:
    needs:
    - version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - name: 登录 Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: 检查已发布镜像
      id: existing
      env:
        IMAGE_NAME: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
        RELEASE_VERSION: ${{ needs.version.outputs.version }}
      run: |
        inspection="$RUNNER_TEMP/release-image-inspection.log"
        if docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_VERSION" >/dev/null 2>"$inspection"; then
          echo 'found=true' >> "$GITHUB_OUTPUT"
        elif grep -Eq '(: not found|manifest unknown|name unknown)(:|$)' "$inspection"; then
          echo 'found=false' >> "$GITHUB_OUTPUT"
        else
          cat "$inspection" >&2
          exit 1
        fi
    - name: 构建并发布镜像
      if: steps.existing.outputs.found != 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/arm64
        push: true
        tags: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ needs.version.outputs.version
          }}
        build-args: |
          VERSION=${{ needs.version.outputs.version }}
          VCS_REF=${{ github.sha }}
        cache-from: type=gha,scope=chat2me
        cache-to: type=gha,mode=max,scope=chat2me
    strategy:
      fail-fast: false
      matrix:
        include:
        - image: chat2me-llm
          dockerfile: services/llm/Dockerfile
        - image: chat2me-core
          dockerfile: services/core/Dockerfile
        - image: chat2me-relay
          dockerfile: services/relay/Dockerfile
        - image: chat2me-asr
          dockerfile: services/asr/Dockerfile
        - image: chat2me-tts
          dockerfile: services/tts/Dockerfile
        - image: chat2me-speech
          dockerfile: services/speech/Dockerfile
  release:
    name: 发布 GitHub Release
    needs:
    - version
    - image
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.skip != 'true' && (needs.image.result
      == 'success' || (needs.image.result == 'skipped' && needs.version.outputs.released == 'true')) }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRODUCT_NAME: Chat2Me
      RELEASE_ASSETS: ''
      RELEASE_IMAGES: |-
        ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/chat2me-llm
        ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/chat2me-core
        ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/chat2me-relay
        ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/chat2me-asr
        ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/chat2me-tts
        ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/chat2me-speech
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: 检查当前 Release 状态
      id: state
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/state.py
    - name: 发布或恢复 Release
      id: publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/publish.py
    - name: 设置 Docker Buildx
      if: steps.publish.outputs.latest == 'true'
      uses: docker/setup-buildx-action@v4
    - name: 登录镜像仓库
      if: steps.publish.outputs.latest == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: 更新镜像 latest
      if: steps.publish.outputs.latest == 'true'
      run: |
        set -euo pipefail
        for image in $RELEASE_IMAGES; do
          docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
        done
